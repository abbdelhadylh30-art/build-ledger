name: Build Windows .exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Stackmint Studio ${{ github.ref_name }}'
          releaseBody: |
            ## Stackmint Studio ${{ github.ref_name }}

            Portfolio & launcher for the Stackmint suite (Build Ledger, Pulse Chat, custom development).

            Download `Stackmint-Studio_*.exe` (NSIS installer) or `Stackmint-Studio_*.msi` (MSI installer) below.
            Double-click to install — Windows 10/11 with WebView2 (preinstalled on most systems).
          releaseDraft: false
          prerelease: false
