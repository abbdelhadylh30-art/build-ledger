[package]
name = "stackmint-hub"
version = "1.0.0"
description = "Stackmint Studio — portfolio & launcher"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "stackmint_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
